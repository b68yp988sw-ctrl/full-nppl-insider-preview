<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Typical C42 tail seen from behind: a magnifier runs along the underside of the strut-braced horizontal stabiliser and finds damage to report; a side view shows the elevator moving fully up and down, and the hinges and fasteners are checked secure">
<title>Horizontal stabiliser — underside damage, full elevator movement, fasteners (typical)</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c0c16"/><stop offset="1" stop-color="#07070c"/></linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e4e7ee"/><stop offset=".5" stop-color="#a9afbd"/><stop offset="1" stop-color="#6b7086"/></linearGradient>
  <linearGradient id="metalh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6b7086"/><stop offset=".45" stop-color="#d9dde5"/><stop offset="1" stop-color="#7d8296"/></linearGradient>
  <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2d3d"/><stop offset="1" stop-color="#171822"/></linearGradient>
  <linearGradient id="fab" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#262a3c"/><stop offset="1" stop-color="#1a1c2a"/></linearGradient>
  <radialGradient id="glass" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#93c5fd" stop-opacity=".28"/><stop offset="1" stop-color="#8b5cf6" stop-opacity=".12"/></radialGradient>
  
</defs>
<style>
  text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  .lens{animation:lens 4s linear infinite}
  .dmg{animation:dmg 4s linear infinite}
  .el{transform-origin:82px 124px;animation:el 4s ease-in-out infinite}
  .ins{animation:ins 4s linear infinite}
  .hg{animation:hg 4s linear infinite}
  @keyframes lens{0%{transform:translate(36px,84px);opacity:0}4%{opacity:1}42%{transform:translate(204px,84px);opacity:1}46%,100%{transform:translate(204px,84px);opacity:0}}
  @keyframes dmg{0%,26%{opacity:.15}30%,100%{opacity:1}}
  @keyframes ins{0%,44%{opacity:.25}50%,97%{opacity:1}100%{opacity:.25}}
  @keyframes el{0%,50%{transform:rotate(0)}60%,64%{transform:rotate(-26deg)}76%,80%{transform:rotate(18deg)}90%,100%{transform:rotate(0)}}
  @keyframes hg{0%,82%{fill:#d4af37}86%,100%{fill:#22c55e}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.lens{display:none}}
</style>
<rect width="240" height="160" rx="12" fill="url(#bg)"/>

<text x="120" y="12" text-anchor="middle" font-size="6.4" font-weight="700" letter-spacing=".8" fill="#8d93a4">TAIL FROM BEHIND · LOOKING FORWARD</text>
<!-- fin + rudder edge-on -->
<path d="M114 76 L116 20 L124 20 L126 76Z" fill="url(#fab)" stroke="#3d3d6b"/>
<!-- stabiliser seen from slightly below: underside band -->
<path d="M22 72 L218 72 L222 88 L18 88Z" fill="url(#fab)" stroke="#3d3d6b"/>
<path d="M20 81 H220" stroke="#4b4f78" stroke-dasharray="3 2"/>
<text x="39" y="79" text-anchor="middle" font-size="4.8" font-weight="700" letter-spacing=".4" fill="#5b6077">STABILISER</text>
<text x="180" y="87" text-anchor="middle" font-size="4.8" font-weight="700" letter-spacing=".4" fill="#5b6077">ELEVATOR</text>
<!-- boom -->
<circle cx="120" cy="80" r="7" fill="url(#metal)" stroke="#3d3d6b"/>
<!-- empennage struts: fin to stabiliser -->
<!-- tail struts: rear fuselage tube (under the boom) up to fittings on the FIXED stabiliser, forward of the hinge line -->
<path d="M117 87 L118 92 H122 L123 87" fill="#7d8296" stroke="#3d3d6b" stroke-width=".5"/>
<path d="M118.5 91 L62 76.5 M121.5 91 L178 76.5" stroke="#a6acbb" stroke-width="1.6" stroke-linecap="round"/>
<g fill="#0b0b14" stroke="#a6acbb" stroke-width=".9"><circle cx="62" cy="76.5" r="1.9"/><circle cx="178" cy="76.5" r="1.9"/><circle cx="120" cy="91" r="1.7"/></g>
<text x="182" y="99" font-size="5" font-weight="700" fill="#8d93a4">STRUT</text><text x="182" y="105" font-size="4.2" font-weight="700" fill="#6b7090">to stabiliser</text>
<g class="hg" fill="#d4af37"><circle cx="44" cy="82.5" r="1.5"/><circle cx="72" cy="82.5" r="1.5"/><circle cx="100" cy="82.5" r="1.5"/><circle cx="140" cy="82.5" r="1.5"/><circle cx="168" cy="82.5" r="1.5"/><circle cx="196" cy="82.5" r="1.5"/></g>
<!-- damage on underside -->
<g class="dmg"><path d="M146 78 l3 -3 2 3 3 -3" fill="none" stroke="#f87171" stroke-width="1.3"/><circle cx="150" cy="77" r="5.5" fill="none" stroke="#f87171" stroke-width="1.3"/>
 <path d="M154 72.5 L182 33" stroke="#f87171" stroke-width="1"/><g><rect x="134.5" y="16" width="97.5" height="17" rx="5" fill="#2a1416" stroke="#f87171"/><text x="183.2" y="27.5" text-anchor="middle" font-size="6.8" font-weight="700" fill="#fecaca">Underside damage: report</text></g></g>
<!-- inset: elevator side view -->
<g class="ins"><rect x="10" y="98" width="110" height="46" rx="7" fill="#0b0b14" stroke="#2a2a46"/>
 <text x="18" y="140" font-size="5.4" font-weight="700" letter-spacing=".5" fill="#8d93a4">SIDE VIEW</text>
 <path d="M22 124 Q26 119 38 119 L82 122 L82 126 L38 129 Q26 129 22 124Z" fill="url(#fab)" stroke="#3d3d6b"/>
 <path d="M82 124 L110 124" stroke="#4b4f78" stroke-width="1" stroke-dasharray="2 2" transform="rotate(-26 82 124)"/>
 <path d="M82 124 L110 124" stroke="#4b4f78" stroke-width="1" stroke-dasharray="2 2" transform="rotate(18 82 124)"/>
 <g class="el"><path d="M82 121.4 L110 123.5 L110 124.5 L82 126.6Z" fill="#cfd3dc" stroke="#8d93a4" stroke-width=".6"/><circle cx="82" cy="124" r="2.6" fill="#cfd3dc" stroke="#8d93a4" stroke-width=".6"/></g>
 <text x="114" y="107" text-anchor="end" font-size="5.2" font-weight="700" fill="#e8c96a">full UP</text>
 <text x="114" y="140" text-anchor="end" font-size="5.2" font-weight="700" fill="#e8c96a">full DOWN</text>
 <circle cx="82" cy="124" r="1.6" fill="#d4af37"/>
</g>
<g><rect x="153.3" y="110" width="78.7" height="17" rx="5" fill="#231d0b" stroke="#d4af37"/><text x="192.7" y="121.5" text-anchor="middle" font-size="6.6" font-weight="700" fill="#e8c96a">Full &amp; free movement</text></g>
<g><g><rect x="133.3" y="129" width="98.7" height="17" rx="5" fill="#0f2418" stroke="#22c55e"/><text x="182.6" y="140.5" text-anchor="middle" font-size="6.6" font-weight="700" fill="#86efac">Hinges &amp; fasteners secure</text></g></g>
<g class="lens"><g class="lensin">
  <path d="M9 9 L22 22" stroke="#d4af37" stroke-width="4.5" stroke-linecap="round"/>
  <circle r="12" fill="url(#glass)" stroke="#c9ced8" stroke-width="2.4"/>
  <path d="M-7 -4.5 A8 8 0 0 1 -2 -8.5" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" opacity=".8"/>
</g></g>

<text x="232" y="152" text-anchor="end" font-size="6" fill="#8d93a4">TYPICAL strut-braced tailplane · C42</text>
</svg>

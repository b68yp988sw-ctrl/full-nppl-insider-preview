<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Typical C42 gull-wing door hinged along the top: open, check hinges and struts, close and latch with no gap at the bottom; then the main gear leg, shock absorber, spat and tyre are checked and the aircraft rebounds when pushed down">
<title>Doors and undercarriage — door latch, main gear legs, dampers, spats and tyres (typical)</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c0c16"/><stop offset="1" stop-color="#07070c"/></linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e4e7ee"/><stop offset=".5" stop-color="#a9afbd"/><stop offset="1" stop-color="#6b7086"/></linearGradient>
  <linearGradient id="metalh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6b7086"/><stop offset=".45" stop-color="#d9dde5"/><stop offset="1" stop-color="#7d8296"/></linearGradient>
  <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2d3d"/><stop offset="1" stop-color="#171822"/></linearGradient>
  <linearGradient id="fab" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#262a3c"/><stop offset="1" stop-color="#1a1c2a"/></linearGradient>
  <radialGradient id="glass" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#93c5fd" stop-opacity=".28"/><stop offset="1" stop-color="#8b5cf6" stop-opacity=".12"/></radialGradient>
  
</defs>
<style>
  text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  .door{transform-origin:100px 30px;animation:door 4s ease-in-out infinite}
  .latch{transform-origin:131px 80px;animation:latch 4s ease-in-out infinite}
  .pa{animation:pa 4s linear infinite}
  .pb{animation:pb 4s linear infinite}
  .bounce{animation:bounce 4s ease-in-out infinite}
  .damp{transform-origin:162px 124px;animation:damp 4s ease-in-out infinite}
  @keyframes door{0%,4%{transform:scaleY(1)}14%,22%{transform:scaleY(.3)}34%,100%{transform:scaleY(1)}}
  @keyframes latch{0%,34%{transform:rotate(-70deg)}42%,100%{transform:rotate(0)}}
  @keyframes pa{0%,36%{opacity:.2}42%,96%{opacity:1}100%{opacity:.2}}
  @keyframes pb{0%,52%{opacity:.2}58%,96%{opacity:1}100%{opacity:.2}}
  @keyframes bounce{0%,56%{transform:translateY(0)}62%{transform:translateY(5px)}70%{transform:translateY(-1.5px)}76%,100%{transform:translateY(0)}}
  @keyframes damp{0%,56%{transform:scaleY(1)}62%{transform:scaleY(.8)}70%{transform:scaleY(1.04)}76%,100%{transform:scaleY(1)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="240" height="160" rx="12" fill="url(#bg)"/>
<g transform="translate(0,-6)">
<g class="bounce">
  <!-- wing root (high wing) -->
  <rect x="40" y="20" width="200" height="8" rx="3" fill="#1b1c28" stroke="#2a2a46"/>
  <!-- cabin pod, left side, nose left -->
  <path d="M10 84 Q8 62 30 52 L64 28 L170 28 L196 56 L230 60 L230 72 L196 76 L178 100 L40 100 Q14 98 10 84Z" fill="url(#skin)" stroke="#3d3d6b"/>
  <path d="M30 52 L64 28 L70 28 L70 64 L36 64Z" fill="#93c5fd" fill-opacity=".12" stroke="#3d3d6b"/>
  <!-- gull-wing door, hinged along the top -->
  <g class="door">
    <path d="M72 30 L156 30 L156 92 L72 92Z" fill="#1f2232" stroke="#a6acbb" stroke-width="1.1"/>
    <path d="M76 34 L152 34 L152 64 L76 64Z" fill="#93c5fd" fill-opacity=".16" stroke="#3d3d6b"/>
  </g>
  <path d="M72 30 L156 30" stroke="#d4af37" stroke-width="1.6"/>
  <text x="114" y="26" text-anchor="middle" font-size="5.8" font-weight="700" fill="#e8c96a">HINGES</text>
  <g class="latch"><rect x="126" y="78" width="14" height="4" rx="2" fill="#c9ced8"/><circle cx="131" cy="80" r="2.2" fill="#6b7086"/></g>
</g>
<!-- main gear: trailing arm, shock absorber, spat -->
<path d="M122 101 L168 129" stroke="#a6acbb" stroke-width="3.2" stroke-linecap="round"/>
<g class="damp">
  <rect x="159" y="100" width="6" height="24" rx="2" fill="#2c2f40" stroke="#a6acbb" stroke-width=".7"/>
  <path d="M158 104 h8 M158 108 h8 M158 112 h8 M158 116 h8 M158 120 h8" stroke="#d4af37" stroke-width=".9"/>
</g>
<g>
  <circle cx="170" cy="132" r="12" fill="none" stroke="#1d1e27" stroke-width="6.4"/>
  <circle cx="170" cy="132" r="15.4" fill="none" stroke="#3d3d6b" stroke-width=".7"/>
  <circle cx="170" cy="132" r="7.5" fill="url(#metal)"/>
  <path d="M148 132 Q148 114 170 112 Q194 112 198 128 L198 134 L148 134Z" fill="url(#skin)" stroke="#a6acbb" stroke-width="1"/>
  <circle cx="170" cy="132" r="2.4" fill="#6b7086"/>
</g>
<g class="pa"><g><rect x="8.0" y="108" width="120.8" height="17" rx="5" fill="#0f2418" stroke="#22c55e"/><text x="68.4" y="119.5" text-anchor="middle" font-size="7" font-weight="700" fill="#86efac">Door latched · no gap at bottom</text></g>
  <path d="M100 110 L124 84" stroke="#22c55e" stroke-width="1"/></g>
<g class="pb"><g><rect x="8.0" y="130" width="124.7" height="17" rx="5" fill="#231d0b" stroke="#d4af37"/><text x="70.4" y="141.5" text-anchor="middle" font-size="7" font-weight="700" fill="#e8c96a">Gear legs, dampers, spats, tyres</text></g>
  <path d="M126 138 L146 136" stroke="#d4af37" stroke-width="1"/></g>
<g class="pb"><text x="232" y="110" text-anchor="end" font-size="6.2" font-weight="700" fill="#e8c96a">push down:</text><text x="232" y="118" text-anchor="end" font-size="6.2" font-weight="700" fill="#e8c96a">rebounds</text></g>
</g>
<text x="232" y="152" text-anchor="end" font-size="6" fill="#8d93a4">TYPICAL gull-wing door &amp; main gear · C42</text>
</svg>

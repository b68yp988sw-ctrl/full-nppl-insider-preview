<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Typical C42 nosewheel: the leg, fork and wheel spat are rocked to check they are secure, then the tyre is checked for wear and the creep mark: paint marks on tyre and rim lined up is OK, split marks mean the tyre has crept and must be reported">
<title>Nosewheel — leg, fork and spat security; tyre wear and creep (typical)</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c0c16"/><stop offset="1" stop-color="#07070c"/></linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e4e7ee"/><stop offset=".5" stop-color="#a9afbd"/><stop offset="1" stop-color="#6b7086"/></linearGradient>
  <linearGradient id="metalh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6b7086"/><stop offset=".45" stop-color="#d9dde5"/><stop offset="1" stop-color="#7d8296"/></linearGradient>
  <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2d3d"/><stop offset="1" stop-color="#171822"/></linearGradient>
  <linearGradient id="fab" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#262a3c"/><stop offset="1" stop-color="#1a1c2a"/></linearGradient>
  <radialGradient id="glass" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#93c5fd" stop-opacity=".28"/><stop offset="1" stop-color="#8b5cf6" stop-opacity=".12"/></radialGradient>
  
</defs>
<style>
  text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  .spat{transform-origin:60px 70px;animation:wig 4s ease-in-out infinite}
  .ring{animation:ring 4s linear infinite}
  .ins{animation:ins 4s linear infinite}
  .lens{animation:lens 4s ease-in-out infinite}
  @keyframes wig{0%,8%{transform:rotate(0)}12%{transform:rotate(-4deg)}16%{transform:rotate(3.5deg)}20%{transform:rotate(-3deg)}24%,100%{transform:rotate(0)}}
  @keyframes ring{0%,4%{opacity:.2}8%,44%{opacity:1}50%,100%{opacity:.2}}
  @keyframes ins{0%,46%{opacity:.18}52%,96%{opacity:1}100%{opacity:.18}}
  @keyframes lens{0%,46%{transform:translate(150px,58px);opacity:0}50%{opacity:1}62%{transform:translate(150px,58px)}74%{transform:translate(206px,58px);opacity:1}90%{transform:translate(206px,58px);opacity:1}96%,100%{transform:translate(206px,58px);opacity:0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.lens{display:none}}
</style>
<rect width="240" height="160" rx="12" fill="url(#bg)"/>

<!-- cowling / nose (left-side view, nose to the left) -->
<path d="M14 36 Q16 20 40 16 L118 14 L118 54 L44 56 Q18 54 14 36Z" fill="#11111c" stroke="#2a2a46"/>
<ellipse cx="13" cy="37" rx="4.5" ry="9" fill="#1b1c28" stroke="#2a2a46"/>
<text x="76" y="38" text-anchor="middle" font-size="6.2" font-weight="700" letter-spacing=".6" fill="#3d3d6b">COWLING</text>
<!-- nose leg + polyurethane spring stack -->
<rect x="54" y="54" width="12" height="3" rx="1.2" fill="#3d3d6b"/>
<rect x="56" y="57" width="8" height="5" rx="1" fill="#2c2f40"/>
<g class="spat">
  <rect x="56" y="62" width="8" height="34" rx="2" fill="url(#metalh)" stroke="#3d3d6b" stroke-width=".6"/>
  <path d="M56.5 96 L56.5 112 M63.5 96 L63.5 112" stroke="#7d8296" stroke-width="2.4"/>
  <circle cx="60" cy="112" r="14.2" fill="none" stroke="#1d1e27" stroke-width="7.4"/>
  <circle cx="60" cy="112" r="10.5" fill="url(#metal)"/><circle cx="60" cy="112" r="2.6" fill="#6b7086"/>
  <path d="M34 112 Q34 90 60 88 Q88 88 94 108 L94 115 L34 115Z" fill="url(#skin)" stroke="#a6acbb" stroke-width="1"/>
  <path d="M40 104 Q60 96 86 102" fill="none" stroke="#60a5fa" stroke-width="1.6" opacity=".7"/>
</g>
<g class="ring">
  <ellipse cx="62" cy="96" rx="40" ry="40" fill="none" stroke="#d4af37" stroke-width="1.6" stroke-dasharray="5 4"/>
</g>
<g class="ring"><g><rect x="20.0" y="136" width="108.5" height="17" rx="5" fill="#231d0b" stroke="#d4af37"/><text x="74.2" y="147.5" text-anchor="middle" font-size="7" font-weight="700" fill="#e8c96a">Leg, fork &amp; spat secure</text></g></g>
<!-- tyre creep insets -->
<g class="ins">
  <text x="178" y="24" text-anchor="middle" font-size="6.4" font-weight="700" letter-spacing=".5" fill="#a6acbb">TYRE: WEAR &amp; CREEP MARK</text>
  <circle cx="150" cy="58" r="14.2" fill="none" stroke="#1d1e27" stroke-width="7.4"/>
  <circle cx="150" cy="58" r="17.9" fill="none" stroke="#3d3d6b" stroke-width=".8"/>
  <circle cx="150" cy="58" r="10.5" fill="url(#metal)"/><circle cx="150" cy="58" r="2.6" fill="#6b7086"/>
  <path d="M150.0 54.0 L150.0 48.0" stroke="#e11d48" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M150.0 47.0 L150.0 40.5" stroke="#fb7185" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="206" cy="58" r="14.2" fill="none" stroke="#1d1e27" stroke-width="7.4"/>
  <circle cx="206" cy="58" r="17.9" fill="none" stroke="#3d3d6b" stroke-width=".8"/>
  <circle cx="206" cy="58" r="10.5" fill="url(#metal)"/><circle cx="206" cy="58" r="2.6" fill="#6b7086"/>
  <path d="M206.0 54.0 L206.0 48.0" stroke="#e11d48" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M211.8 48.7 L215.3 43.2" stroke="#fb7185" stroke-width="2.4" stroke-linecap="round"/>
  <g><rect x="123.4" y="84" width="53.2" height="17" rx="5" fill="#0f2418" stroke="#22c55e"/><text x="150.0" y="95.5" text-anchor="middle" font-size="6.8" font-weight="700" fill="#86efac">Lined up: OK</text></g>
  <g><rect x="180.1" y="84" width="51.8" height="17" rx="5" fill="#2a1416" stroke="#f87171"/><text x="206.0" y="95.5" text-anchor="middle" font-size="6.8" font-weight="700" fill="#fecaca">Split: crept</text></g>
  <text x="178" y="116" text-anchor="middle" font-size="6.4" fill="#a6acbb">Also look for cuts, flats &amp; worn tread</text>
</g>
<g class="lens"><g class="lensin">
  <path d="M9 9 L22 22" stroke="#d4af37" stroke-width="4.5" stroke-linecap="round"/>
  <circle r="12" fill="url(#glass)" stroke="#c9ced8" stroke-width="2.4"/>
  <path d="M-7 -4.5 A8 8 0 0 1 -2 -8.5" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" opacity=".8"/>
</g></g>

<text x="232" y="152" text-anchor="end" font-size="6" fill="#8d93a4">TYPICAL steerable nosewheel · C42</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Power check: throttle advanced, rpm needle rises from idle to 3500 and holds, then back to idle">
<title>P — Power check: ~3500 RPM (typical Rotax 912 tachometer)</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c0c16"/><stop offset="1" stop-color="#07070c"/></linearGradient>
  <radialGradient id="face" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#1a1a2e"/><stop offset="1" stop-color="#0b0b14"/></radialGradient>
  <linearGradient id="knob" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
</defs>
<style>
  text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  .needle{transform-origin:92px 86px;animation:needle 4s cubic-bezier(.3,0,.2,1) infinite}
  .thr{animation:thr 4s cubic-bezier(.3,0,.2,1) infinite}
  .idle{animation:idle 4s linear infinite}
  .rpm{animation:rpm 4s linear infinite}
  .tgt{animation:tgt 4s linear infinite}
  @keyframes needle{0%,10%{transform:rotate(-72deg)}38%{transform:rotate(3deg)}43%,80%{transform:rotate(0)}94%,100%{transform:rotate(-72deg)}}
  @keyframes thr{0%,10%{transform:translateY(0)}38%,80%{transform:translateY(-46px)}94%,100%{transform:translateY(0)}}
  @keyframes idle{0%,12%{opacity:1}16%,88%{opacity:0}94%,100%{opacity:1}}
  @keyframes rpm{0%,40%{opacity:0}44%,80%{opacity:1}85%,100%{opacity:0}}
  @keyframes tgt{0%,40%{fill:#8d93a4}44%,80%{fill:#e8c96a}85%,100%{fill:#8d93a4}}
  @media (prefers-reduced-motion:reduce){.needle,.thr,.idle,.rpm,.tgt{animation-duration:0s;animation-iteration-count:1;animation-delay:-2.4s}}
</style>
<rect width="240" height="160" rx="12" fill="url(#bg)"/>
<circle cx="92" cy="86" r="62" fill="#14142a" stroke="#3d3d6b" stroke-width="2"/>
<circle cx="92" cy="86" r="56" fill="url(#face)"/>
<g fill="none" stroke-width="5">
  <path d="M48.3 71.8 A46 46 0 0 1 134.8 69.2" stroke="#34d399"/>
  <path d="M134.8 69.2 A46 46 0 0 1 137.1 77.1" stroke="#fbbf24"/>
  <path d="M137.1 77.1 A46 46 0 0 1 131.8 109.0" stroke="#f87171"/>
</g>
<g stroke="#c9ced8" stroke-linecap="round"><path d="M48.7 111.0 L55.6 107.0" stroke-width="1.6"/><path d="M43.3 97.1 L47.2 96.2" stroke-width="1"/><path d="M42.1 82.3 L50.1 82.9" stroke-width="1.6"/><path d="M45.5 67.7 L49.2 69.2" stroke-width="1"/><path d="M52.9 54.8 L59.2 59.8" stroke-width="1.6"/><path d="M63.8 44.7 L66.1 48.0" stroke-width="1"/><path d="M77.3 38.2 L79.6 45.9" stroke-width="1.6"/><path d="M92.0 36.0 L92.0 40.0" stroke-width="1"/><path d="M106.7 38.2 L104.4 45.9" stroke-width="1.6"/><path d="M120.2 44.7 L117.9 48.0" stroke-width="1"/><path d="M131.1 54.8 L124.8 59.8" stroke-width="1.6"/><path d="M138.5 67.7 L134.8 69.2" stroke-width="1"/><path d="M141.9 82.3 L133.9 82.9" stroke-width="1.6"/><path d="M140.7 97.1 L136.8 96.2" stroke-width="1"/><path d="M135.3 111.0 L128.4 107.0" stroke-width="1.6"/></g>
<g font-size="8" font-weight="700" fill="#c9ced8"><text x="63.4" y="105.3" text-anchor="middle">0</text><text x="59.1" y="86.3" text-anchor="middle">1</text><text x="66.2" y="68.2" text-anchor="middle">2</text><text x="82.3" y="57.3" text-anchor="middle">3</text><text x="101.7" y="57.3" text-anchor="middle">4</text><text x="117.8" y="68.2" text-anchor="middle">5</text><text x="124.9" y="86.3" text-anchor="middle">6</text><text x="120.6" y="105.3" text-anchor="middle">7</text></g>
<path class="tgt" d="M92.0 31.0 l-4 -6 h8z" fill="#8d93a4"/>
<text x="92" y="106" text-anchor="middle" font-size="6" letter-spacing=".8" fill="#8d93a4">RPM ×1000</text>
<g class="idle"><text x="92" y="120" text-anchor="middle" font-size="9" font-weight="800" fill="#a6acbb">IDLE</text></g>
<g class="rpm"><rect x="70" y="111" width="44" height="13" rx="4" fill="#231d0b" stroke="#d4af37"/><text x="92" y="120.5" text-anchor="middle" font-size="9" font-weight="800" fill="#e8c96a">3500</text></g>
<g class="needle"><path d="M90.4 94 L92 39 L93.6 94Z" fill="#f1f3f8"/><circle cx="92" cy="86" r="5" fill="#2a2a46" stroke="#c9ced8"/></g>
<!-- throttle quadrant -->
<text x="196" y="18" text-anchor="middle" font-size="7" font-weight="700" letter-spacing="1" fill="#a6acbb">THROTTLE</text>
<rect x="184" y="24" width="24" height="96" rx="6" fill="#14142a" stroke="#3d3d6b"/>
<rect x="194.5" y="30" width="3" height="84" rx="1.5" fill="#07070c"/>
<text x="214" y="36" font-size="6" fill="#8d93a4">FWD</text><text x="214" y="114" font-size="6" fill="#8d93a4">IDLE</text>
<g class="thr"><rect x="186" y="98" width="20" height="14" rx="5" fill="url(#knob)" stroke="#c4b5fd" stroke-width=".8"/></g>
<rect x="166" y="128" width="66" height="14" rx="5" fill="#1e1e36" stroke="#2a2a46"/>
<text x="199" y="137.6" text-anchor="middle" font-size="6.2" font-weight="700" fill="#c9ced8">BRAKES ON · INTO WIND</text>
<text x="10" y="156" font-size="5.6" fill="#8d93a4">TYPICAL Rotax 912 markings · confirm figure with POH / instructor</text>
</svg>
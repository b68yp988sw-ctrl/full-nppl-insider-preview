<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Typical C42 3-blade propeller: magnifier sweeps the leading edge, finds a nick, then the spinner is checked for security">
<title>Propeller — leading-edge and spinner check (typical)</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c0c16"/><stop offset="1" stop-color="#07070c"/></linearGradient>
  <linearGradient id="blade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a4f63"/><stop offset=".35" stop-color="#2c2f40"/><stop offset="1" stop-color="#15161f"/></linearGradient>
  <radialGradient id="spin" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#c9ced8"/><stop offset="1" stop-color="#6b7086"/></radialGradient>
  <radialGradient id="glass" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#93c5fd" stop-opacity=".28"/><stop offset="1" stop-color="#8b5cf6" stop-opacity=".12"/></radialGradient>
  <path id="bl" d="M78 83 C112 76 170 75 214 79 Q230 82 230 88 Q230 94 214 96 C170 99 112 103 78 101Z"/>
</defs>
<style>
  text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  .lens{animation:lens 4s linear infinite}
  .nick{transform-origin:176px 78px;animation:nick 4s ease-out infinite}
  .nicklbl{animation:nicklbl 4s linear infinite}
  .le{animation:le 4s linear infinite}
  .spinner{transform-origin:60px 92px;animation:wig 4s ease-in-out infinite}
  .sring{animation:sring 4s linear infinite}
  @keyframes lens{0%{transform:translate(96px,72px);opacity:0}5%{opacity:1}45%{transform:translate(206px,74px);opacity:1}52%{transform:translate(206px,74px);opacity:0}100%{transform:translate(96px,72px);opacity:0}}
  @keyframes nick{0%,33%{opacity:0;transform:scale(.4)}36%{opacity:1;transform:scale(1.25)}40%{transform:scale(1)}56%{opacity:1}62%,100%{opacity:0;transform:scale(1)}}
  @keyframes nicklbl{0%,35%{opacity:0}39%,58%{opacity:1}63%,100%{opacity:0}}
  @keyframes le{0%,3%{opacity:0}8%,46%{opacity:1}52%,100%{opacity:0}}
  @keyframes wig{0%,64%{transform:rotate(0)}68%{transform:rotate(-7deg)}72%{transform:rotate(6deg)}76%{transform:rotate(-5deg)}80%,100%{transform:rotate(0)}}
  @keyframes sring{0%,60%{opacity:0}64%,90%{opacity:1}95%,100%{opacity:0}}
  @media (prefers-reduced-motion:reduce){.lens,.nick,.nicklbl,.le,.spinner,.sring{animation-duration:0s;animation-iteration-count:1;animation-delay:-1.6s}}
</style>
<rect width="240" height="160" rx="12" fill="url(#bg)"/>
<!-- faint cowling -->
<path d="M0 60 Q40 50 80 66 L80 120 Q40 136 0 128Z" fill="#11111c" stroke="#2a2a46"/>
<!-- other two blades (dimmed) -->
<g opacity=".5"><use href="#bl" fill="url(#blade)" stroke="#3d3d6b" transform="rotate(-120 60 92)"/><use href="#bl" fill="url(#blade)" stroke="#3d3d6b" transform="rotate(120 60 92)"/></g>
<!-- main blade -->
<use href="#bl" fill="url(#blade)" stroke="#3d3d6b"/>
<path d="M80 83 C112 76 170 75 214 79" fill="none" stroke="#c9ced8" stroke-width="1.1" stroke-opacity=".75"/>
<!-- nick on leading edge -->
<path d="M172.2 76.4 L176 81.5 L179.8 76.4Z" fill="#07070c"/>
<g class="nick"><circle cx="176" cy="78" r="8" fill="none" stroke="#f87171" stroke-width="2"/></g>
<g class="nicklbl">
  <path d="M181 71 L192 53" stroke="#f87171" stroke-width="1.2"/>
  <rect x="160" y="36" width="72" height="17" rx="5" fill="#2a1416" stroke="#f87171"/>
  <text x="196" y="47.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#fecaca">NICK — report it</text>
</g>
<g class="le"><path d="M120 62 V76" stroke="#a6acbb" stroke-width=".8"/><text x="120" y="58" text-anchor="middle" font-size="7" font-weight="700" letter-spacing=".6" fill="#a6acbb">LEADING EDGE</text></g>
<!-- spinner -->
<circle cx="60" cy="92" r="23.5" fill="#2b2f3e" stroke="#3d3d6b"/>
<g class="spinner">
  <circle cx="60" cy="92" r="20" fill="url(#spin)"/>
  <circle cx="60" cy="92" r="3" fill="#8d93a4"/>
  <g fill="#6b7086"><circle cx="60" cy="74.5" r="1.3"/><circle cx="75.2" cy="100.8" r="1.3"/><circle cx="44.8" cy="100.8" r="1.3"/></g>
</g>
<g class="sring">
  <circle cx="60" cy="92" r="28" fill="none" stroke="#d4af37" stroke-width="1.8" stroke-dasharray="5 4"/>
  <path d="M38 64 a32 32 0 0 1 14-9" fill="none" stroke="#e8c96a" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M49 52 l4 3 -4 3" fill="none" stroke="#e8c96a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="94" y="112" width="96" height="17" rx="5" fill="#231d0b" stroke="#d4af37"/>
  <text x="142" y="123.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#e8c96a">SPINNER secure · no cracks</text>
</g>
<!-- magnifier -->
<g class="lens">
  <path d="M9 9 L24 24" stroke="#d4af37" stroke-width="5" stroke-linecap="round"/>
  <circle r="13.5" fill="url(#glass)" stroke="#c9ced8" stroke-width="2.6"/>
  <path d="M-8 -5 A9 9 0 0 1 -2 -9.5" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".8"/>
</g>
<text x="232" y="152" text-anchor="end" font-size="6" fill="#8d93a4">TYPICAL 3-blade composite · C42</text>
</svg>
